llow-up</div><div class="big" style="font-size:32px">18</div></div></div></div>`,monetization:`<div class="glow"></div><div class="panel"><div class="mini-row"><span class="icon">👥</span><div><h3>Community first</h3><div class="sub">Grow and activate the audience.</div></div></div><div class="mini-row" style="margin-top:14px"><span class="icon">💳</span><div><h3>Commercial mode later</h3><div class="sub">Only after the model is understood and approved.</div></div></div></div>`,approval:`<div class="glow"></div><div class="panel"><div class="box"><div class="tiny">Partner application</div><div class="field"><div class="tiny">Who are you?</div><div class="field-value">Educator / IB / Affiliate / Creator</div></div><div class="field"><div class="tiny">Market focus</div><div class="field-value">Forex / Crypto / Both</div></div><div class="field"><div class="tiny">Community status</div><div class="field-value">Existing or starting new</div></div></div></div>`,compliance:`<div class="glow"></div><div class="panel"><div class="comp-list"><div class="comp-line"><span class="shield">✓</span><b>Training Arena is not a broker.</b></div><div class="comp-line"><span class="shield">✓</span><b>Training Arena does not provide investment advice.</b></div><div class="comp-line"><span class="shield">✓</span><b>Training Arena does not hold client funds in Training Mode.</b></div></div></div>`,final:`<div class="glow"></div><div class="panel"><div class="box active" style="text-align:center;padding:32px"><div style="font-size:38px">💬</div><h3 style="font-size:30px">Partner application</h3><p class="sub" style="line-height:1.75">Open registration form and send application on WhatsApp.</p><button class="btn btn-primary btn-large" onclick="openRequest()" style="margin-top:18px">Open Form</button></div></div>`};
function setLang(l){softRender(function(){lang=l;});}
function render(){const d=data[lang],s=d.steps[active];document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('active'));document.getElementById('lang-'+lang).classList.add('active');document.querySelector('header .btn-primary').textContent=d.apply;document.getElementById('num').textContent=String(active+1).padStart(2,'0');document.getElementById('eyebrow').textContent=s[0];document.getElementById('title').textContent=s[1];document.getElementById('text').textContent=s[2];document.getElementById('note').textContent=s[3]||'';document.getElementById('note').style.display=s[3]?'block':'none';document.getElementById('visual').innerHTML=visualBase[s[4]];document.getElementById('backBtn').style.display=active===0?'none':'inline-flex';document.getElementById('backBtn').textContent=d.back;document.getElementById('continueBtn').innerHTML=active===d.steps.length-1?d.applyAccess+' 💬':d.continue+' →';document.getElementById('progressBar').style.width=((active+1)/d.steps.length*100)+'%';document.getElementById('dots').innerHTML=d.steps.map((_,i)=>`<button class="dot ${i===active?'active':i<active?'done':''}" onclick="jumpStep(${i})"></button>`).join('');renderForm(d);}
function renderChoices(id,arr){document.getElementById(id).innerHTML=arr.map((x,i)=>`<button type="button" class="choice ${i===0?'active':''}" onclick="this.parentNode.querySelectorAll('.choice').forEach(b=>b.classList.remove('active'));this.classList.add('active')">${x}</button>`).join('');}
function renderForm(d){document.getElementById('formEyebrow').textContent=d.form.eyebrow;document.getElementById('formTitle').textContent=d.form.title;document.getElementById('formSubtitle').textContent=d.form.subtitle;document.getElementById('labelName').childNodes[0].textContent=d.form.name;document.getElementById('labelEmail').childNodes[0].textContent=d.form.email;document.getElementById('labelWhatsApp').childNodes[0].textContent=d.form.whatsapp;document.getElementById('labelSize').childNodes[0].textContent=d.form.size;document.getElementById('labelRole').textContent=d.form.role;document.getElementById('labelMarket').textContent=d.form.market;document.getElementById('labelStatus').textContent=d.form.status;document.getElementById('labelChannels').childNodes[0].textContent=d.form.channels;document.getElementById('channelsInput').placeholder=d.form.channelsPh;document.getElementById('labelIntro').childNodes[0].textContent=d.form.intro;document.getElementById('introText').placeholder=d.form.introPh;document.getElementById('submitBtn').textContent=d.form.submit;renderChoices('roleChoices',d.roles);renderChoices('marketChoices',d.markets);renderChoices('statusChoices',d.statuses);}
function softRender(update){const s=document.querySelector('.screen'); if(!s){update();render();return;} s.classList.add('is-switching'); setTimeout(function(){update();render();requestAnimationFrame(function(){s.classList.remove('is-switching')});},140)}
function jumpStep(i){softRender(function(){active=i;});}
function goNext(){if(active===data[lang].steps.length-1){openRequest();return;}softRender(function(){active++;});}
function goBack(){if(active>0){softRender(function(){active--;});}}function openRequest(){document.getElementById('requestModal').classList.add('open')}function closeModals(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModals();if(e.key==='ArrowRight'||e.key==='Enter')goNext();if(e.key==='ArrowLeft')goBack();});document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)closeModals()}));
/* Premium 2026 finance background — subtle BTC / FX / USD atmosphere, no external libraries */
(function(){
  const canvas = document.getElementById('arenaCanvas');
  const aura = document.getElementById('cursorAura');
  if(!canvas) return;
  const ctx = canvas.getContext('2d');
  let w = 0, h = 0, dpr = 1, t = 0;
  let particles = [], glyphs = [], candles = [];
  const mouse = {x:0, y:0, active:false};

  function isMobile(){ return window.innerWidth < 951; }

  function resize(){
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    w = window.innerWidth; h = window.innerHeight;
    canvas.width = Math.floor(w*dpr); canvas.height = Math.floor(h*dpr);
    canvas.style.width = w+'px'; canvas.style.height = h+'px';
    ctx.setTransform(dpr,0,0,dpr,0,0);

    const mobile = isMobile();
    const particleCount = mobile ? 26 : Math.min(118, Math.max(54, Math.floor((w*h)/14500)));
    const glyphCount = mobile ? 3 : 14;
    const candleCount = mobile ? 8 : 24;

    particles = Array.from({length:particleCount}, function(){
      return {
        a:Math.random()*Math.PI*2,
        r:60+Math.random()*Math.min(w,h)*0.58,
        s:.0012+Math.random()*.0028,
        z:.26+Math.random()*.88,
        off:Math.random()*Math.PI*2,
        pulse:Math.random()*Math.PI*2
      };
    });

    const symbols = ['₿','$','€','FX','AC'];
    glyphs = Array.from({length:glyphCount}, function(_,i){
      return {
        txt:symbols[i%symbols.length],
        x:Math.random()*w,
        y:Math.random()*h,
        size: mobile ? 13+Math.random()*8 : 14+Math.random()*24,
        speed:.05+Math.random()*.16,
        drift:(Math.random()-.5)*.18,
        rot:Math.random()*Math.PI*2,
        rs:(Math.random()-.5)*.004,
        alpha: mobile ? .035+Math.random()*.035 : .035+Math.random()*.075,
        gold:i%3===0
      }
    });

    candles = Array.from({length:candleCount}, function(){
      return {
        x:Math.random()*w,
        y:Math.random()*h,
        h: mobile ? 10+Math.random()*28 : 14+Math.random()*46,
        w: mobile ? 3 : 4+Math.random()*3,
        speed:.12+Math.random()*.28,
        alpha: mobile ? .025+Math.random()*.035 : .045+Math.random()*.07,
        up:Math.random()>.45
      }
    });
  }

  function draw(){
    t += 1;
    ctx.clearRect(0,0,w,h);

    const mobile = isMobile();
    const baseX = mobile ? w*.76 : w*.72;
    const baseY = mobile ? h*.24 : h*.52;
    const mx = mouse.active && !mobile ? (mouse.x-w/2)*.035 : 0;
    const my = mouse.active && !mobile ? (mouse.y-h/2)*.035 : 0;
    const cx = baseX + mx;
    const cy = baseY + my;

    const glow = ctx.createRadialGradient(cx,cy,0,cx,cy,Math.min(w,h)*(mobile ? .72 : .56));
    glow.addColorStop(0,'rgba(52,211,153,'+(mobile ? .11 : .18)+')');
    glow.addColorStop(.32,'rgba(59,130,246,'+(mobile ? .045 : .075)+')');
    glow.addColorStop(.58,'rgba(245,158,11,'+(mobile ? .026 : .040)+')');
    glow.addColorStop(1,'rgba(0,0,0,0)');
    ctx.fillStyle=glow;
    ctx.fillRect(0,0,w,h);

    const pts=particles.map(function(p){
      const a=p.a+t*p.s, wave=Math.sin(t*.010+p.off)*18;
      return {
        x:cx+Math.cos(a)*(p.r+wave)*p.z,
        y:cy+Math.sin(a*1.22)*(p.r*.46+wave)*p.z,
        z:p.z,pulse:p.pulse
      };
    });

    if(!mobile){
      for(let i=0;i<pts.length;i++){
        for(let j=i+1;j<pts.length;j++){
          const dx=pts[i].x-pts[j].x,dy=pts[i].y-pts[j].y,dist=Math.sqrt(dx*dx+dy*dy);
          if(dist<108){
            ctx.strokeStyle='rgba(52,211,153,'+((1-dist/108)*.13)+')';
            ctx.lineWidth=.7;
            ctx.beginPath();ctx.moveTo(pts[i].x,pts[i].y);ctx.lineTo(pts[j].x,pts[j].y);ctx.stroke();
          }
        }
      }
    }

    pts.forEach(function(p){
      const size=mobile ? .75+p.z*.85 : 1.0+p.z*1.65+Math.sin(t*.04+p.pulse)*.35;
      ctx.fillStyle='rgba(209,250,229,'+(mobile ? .18 : .30+p.z*.24)+')';
      ctx.beginPath();ctx.arc(p.x,p.y,size,0,Math.PI*2);ctx.fill();
    });

    glyphs.forEach(function(g){
      g.y -= g.speed;
      g.x += g.drift;
      g.rot += g.rs;
      if(g.y < -60){g.y = h+60; g.x = Math.random()*w;}
      ctx.save();
      ctx.translate(g.x,g.y);
      ctx.rotate(g.rot);
      ctx.font='900 '+g.size+'px Inter, Arial, sans-serif';
      ctx.textAlign='center';
      ctx.textBaseline='middle';
      ctx.fillStyle = g.gold ? 'rgba(245,158,11,'+g.alpha+')' : 'rgba(209,250,229,'+g.alpha+')';
      ctx.fillText(g.txt,0,0);
      ctx.restore();
    });

    candles.forEach(function(c){
      c.y -= c.speed;
      if(c.y < -70){c.y = h+70; c.x = Math.random()*w; c.up = Math.random()>.45;}
      const col = c.up ? '52,211,153' : '96,165,250';
      ctx.strokeStyle='rgba('+col+','+c.alpha+')';
      ctx.fillStyle='rgba('+col+','+(c.alpha*.75)+')';
      ctx.lineWidth=1;
      ctx.beginPath();ctx.moveTo(c.x,c.y-c.h*.72);ctx.lineTo(c.x,c.y+c.h*.72);ctx.stroke();
      ctx.fillRect(c.x-c.w/2,c.y-c.h*.24,c.w,c.h*.48);
    });

    if(!mobile){
      ctx.save();ctx.translate(cx,cy);
      for(let k=0;k<4;k++){
        const radius=52+k*38+Math.sin(t*.018+k)*4;
        ctx.strokeStyle=k%2?'rgba(96,165,250,.12)':'rgba(52,211,153,.14)';
        if(k===3) ctx.strokeStyle='rgba(245,158,11,.08)';
        ctx.lineWidth=1;
        ctx.beginPath();ctx.ellipse(0,0,radius,radius*(.36+k*.03),t*.004*(k+1),0,Math.PI*2);ctx.stroke();
      }
      ctx.fillStyle='rgba(52,211,153,.78)';
      ctx.beginPath();ctx.arc(0,0,4.0+Math.sin(t*.07)*1.2,0,Math.PI*2);ctx.fill();
      ctx.restore();
    }

    requestAnimationFrame(draw);
  }

  window.addEventListener('resize', resize);
  window.addEventListener('mousemove', function(e){
    mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true;
    if(aura){aura.style.transform='translate3d('+e.clientX+'px,'+e.clientY+'px,0)';}
    if(!isMobile()){
      document.querySelectorAll('.panel').forEach(function(panel){
        const rect=panel.getBoundingClientRect(), px=(e.clientX-(rect.left+rect.width/2))/rect.width, py=(e.clientY-(rect.top+rect.height/2))/rect.height;
        panel.style.setProperty('--ry',(px*4).toFixed(2)+'deg'); panel.style.setProperty('--rx',(-py*4).toFixed(2)+'deg');
      });
    }
  });
  window.addEventListener('mouseleave', function(){mouse.active=false;if(aura)aura.style.opacity='0';});
  window.addEventListener('mouseenter', function(){if(aura)aura.style.opacity='.86';});
  resize(); draw();
})();

render();
</script>
