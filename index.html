<!doctype html>
<html lang="cs">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>ARENIX — Forex & Crypto Community Creator Tool</title>
  <style>
    :root{
      --bg:#04070d;--panel:#09111d;--line:rgba(255,255,255,.12);--muted:rgba(255,255,255,.66);
      --text:#fff;--emerald:#35e3a2;--cyan:#69d7ff;--gold:#f6c35b;--radius:32px;
      --shadow:0 40px 120px rgba(0,0,0,.45)
    }
    *{box-sizing:border-box} html,body{min-height:100%;margin:0}
    body{background:var(--bg);color:var(--text);font-family:Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;overflow-x:hidden}
    button,input,textarea{font:inherit}
    .bg{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;background:
      radial-gradient(circle at 16% 16%,rgba(53,227,162,.15),transparent 28%),
      radial-gradient(circle at 82% 22%,rgba(105,215,255,.12),transparent 34%),
      radial-gradient(circle at 78% 82%,rgba(246,195,91,.08),transparent 30%),
      linear-gradient(135deg,#03050a,#07111d 52%,#03050a)}
    .bg:before{content:"";position:absolute;inset:-25%;background:conic-gradient(from 180deg at 65% 45%,transparent 0 35%,rgba(53,227,162,.09),transparent 52%,rgba(105,215,255,.075),transparent 76%);animation:slowSpin 54s linear infinite;filter:blur(10px)}
    .bg:after{content:"";position:absolute;inset:0;background-image:linear-gradient(rgba(255,255,255,.026) 1px,transparent 1px),linear-gradient(90deg,rgba(255,255,255,.026) 1px,transparent 1px);background-size:74px 74px;opacity:.42;mask-image:radial-gradient(circle at 60% 45%,#000 0%,transparent 74%)}
    @keyframes slowSpin{to{transform:rotate(360deg)}}
    .float-symbols{position:fixed;inset:0;z-index:0;overflow:hidden;pointer-events:none;opacity:.32}.sym{position:absolute;font-weight:1000;color:rgba(255,255,255,.09);animation:floatUp linear infinite;text-shadow:0 0 30px rgba(53,227,162,.12)}.sym.gold{color:rgba(246,195,91,.105)}.sym.cyan{color:rgba(105,215,255,.09)}
    @keyframes floatUp{from{transform:translate3d(0,18vh,0) rotate(0deg)}to{transform:translate3d(0,-118vh,0) rotate(360deg)}}
    .page{position:relative;z-index:2;min-height:100vh;display:flex;flex-direction:column}.wrap{max-width:1240px;margin:0 auto;width:100%;padding:0 22px}
    header{position:sticky;top:0;z-index:20;border-bottom:1px solid var(--line);background:rgba(4,7,13,.76);backdrop-filter:blur(22px)}
    .nav{height:68px;display:flex;align-items:center;justify-content:space-between;gap:18px}.brand{display:flex;align-items:center;gap:12px;min-width:0}
    .logo{width:42px;height:42px;border-radius:16px;background:#fff;color:#051018;display:grid;place-items:center;font-weight:1000;box-shadow:0 0 42px rgba(255,255,255,.16)}
    .brand-title{font-size:12px;letter-spacing:.28em;font-weight:1000;white-space:nowrap}.brand-sub{display:block;color:rgba(255,255,255,.43);font-size:10px;letter-spacing:.18em;text-transform:uppercase;margin-top:2px;font-weight:900}
    .step-dots{display:flex;gap:7px;align-items:center;justify-content:center;flex:1}.dot{height:9px;width:9px;border:0;border-radius:99px;background:rgba(255,255,255,.18);cursor:pointer;transition:.2s}.dot.active{width:34px;background:var(--emerald);box-shadow:0 0 26px rgba(53,227,162,.28)}.dot.done{background:rgba(53,227,162,.48)}
    .top-actions{display:flex;align-items:center;gap:10px}.pill{border:1px solid var(--line);background:rgba(255,255,255,.045);color:rgba(255,255,255,.76);border-radius:99px;padding:8px 12px;font-size:12px;font-weight:1000;letter-spacing:.04em;white-space:nowrap}
    .progress{height:4px;background:rgba(255,255,255,.05)}.progress>div{height:100%;width:10%;background:linear-gradient(90deg,var(--emerald),var(--cyan));box-shadow:0 0 28px rgba(53,227,162,.26);transition:.35s ease}
    main{flex:1;display:flex}.screen{width:100%;min-height:calc(100vh - 72px);display:grid;grid-template-columns:.92fr 1.08fr;gap:44px;align-items:center;padding-top:34px;padding-bottom:34px}
    .eyebrow{display:inline-flex;align-items:center;gap:10px;border:1px solid var(--line);background:rgba(255,255,255,.045);border-radius:99px;padding:7px 12px;color:rgba(209,250,229,.90);font-size:12px;font-weight:1000;letter-spacing:.16em;text-transform:uppercase}
    .num{width:28px;height:28px;border-radius:99px;display:grid;place-items:center;background:var(--emerald);color:#061018;font-weight:1000;letter-spacing:0}
    h1{font-size:clamp(42px,5.2vw,76px);line-height:.94;letter-spacing:-.065em;margin:24px 0 0;max-width:790px;font-weight:1000}
    .subline{margin:24px 0 0;max-width:760px;color:var(--muted);font-size:18px;line-height:1.72;font-weight:720}.note{margin:16px 0 0;max-width:720px;color:rgba(209,250,229,.82);font-size:14px;line-height:1.62;font-weight:900}
    .actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.btn{border:0;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:9px;border-radius:99px;font-weight:1000;transition:.2s;min-height:48px;padding:0 24px;text-decoration:none}
    .btn-primary{color:#061018;background:linear-gradient(135deg,var(--emerald),#b7ffe1);box-shadow:0 0 38px rgba(53,227,162,.24);position:relative;overflow:hidden}.btn-primary:before{content:"";position:absolute;inset:-120% auto auto -50%;width:45%;height:310%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.55),transparent);transform:rotate(25deg);animation:shine 4.5s ease-in-out infinite}
    @keyframes shine{0%,72%{left:-55%}100%{left:125%}}.btn-ghost{background:rgba(255,255,255,.045);color:rgba(255,255,255,.76);border:1px solid rgba(255,255,255,.13)}
    .visual{position:relative;transition:opacity .18s ease,transform .18s ease,filter .18s ease}.switching .visual,.switching .copy{opacity:.18;transform:translateY(12px);filter:blur(6px)}
    .visual-glow{position:absolute;inset:-18px;border-radius:44px;background:linear-gradient(135deg,rgba(53,227,162,.22),rgba(105,215,255,.14),rgba(246,195,91,.08),transparent);filter:blur(28px);opacity:.9}
    .card{position:relative;border:1px solid rgba(255,255,255,.14);background:linear-gradient(180deg,rgba(12,22,36,.92),rgba(7,13,22,.90));border-radius:var(--radius);padding:20px;box-shadow:var(--shadow);backdrop-filter:blur(22px);overflow:hidden}.card:before{content:"";position:absolute;inset:0;background:radial-gradient(circle at 80% 10%,rgba(53,227,162,.13),transparent 38%);pointer-events:none}
    .card-head{display:flex;align-items:flex-start;justify-content:space-between;gap:16px;margin-bottom:18px;position:relative}.tiny{font-size:10px;font-weight:1000;letter-spacing:.18em;text-transform:uppercase;color:rgba(255,255,255,.40)}
    .card-title{font-size:24px;font-weight:1000;letter-spacing:-.035em;margin:5px 0 0}.badge{border:1px solid rgba(53,227,162,.25);background:rgba(53,227,162,.12);color:#d8ffed;border-radius:99px;padding:7px 10px;font-size:10px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase;white-space:nowrap}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;position:relative}.grid2{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;position:relative}.box{border:1px solid rgba(255,255,255,.11);background:rgba(255,255,255,.04);border-radius:24px;padding:17px;min-height:104px}.box.active{border-color:rgba(53,227,162,.34);background:rgba(53,227,162,.12);box-shadow:0 0 34px rgba(53,227,162,.12)}.box.gold{border-color:rgba(246,195,91,.24);background:rgba(246,195,91,.08)}.big{font-size:44px;font-weight:1000;letter-spacing:-.055em;margin-top:8px}.small{font-size:13px;color:rgba(255,255,255,.56);font-weight:780;line-height:1.45;margin-top:6px}
    .flow{display:grid;gap:10px;position:relative}.flow-row{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:18px;padding:13px;position:relative}.rank{width:34px;height:34px;border-radius:13px;background:rgba(255,255,255,.08);display:grid;place-items:center;font-size:12px;font-weight:1000;color:rgba(255,255,255,.64)}.flow-title{font-weight:1000}.flow-sub{font-size:11px;color:rgba(255,255,255,.43);font-weight:800;margin-top:3px}.status{border-radius:99px;padding:6px 9px;font-size:10px;font-weight:1000;letter-spacing:.12em;text-transform:uppercase;background:rgba(105,215,255,.10);color:#caefff}.status.green{background:rgba(53,227,162,.12);color:#d8ffed}.status.gold{background:rgba(246,195,91,.12);color:#ffe6a3}
    .lifecycle{position:relative;display:grid;gap:12px}.life-line{position:absolute;left:17px;top:44px;bottom:44px;width:2px;background:linear-gradient(var(--emerald),var(--cyan),var(--gold));opacity:.45}.life{display:grid;grid-template-columns:36px 1fr auto;gap:12px;align-items:center;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:18px;padding:12px;position:relative}.life-dot{width:34px;height:34px;border-radius:99px;background:rgba(53,227,162,.16);border:1px solid rgba(53,227,162,.34);display:grid;place-items:center;font-weight:1000;color:#d8ffed}.value{font-size:22px;font-weight:1000;color:#d8ffed;letter-spacing:-.02em}
    .leader{display:grid;gap:9px;position:relative}.leader-row{display:grid;grid-template-columns:auto 1fr auto auto;gap:11px;align-items:center;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:18px;padding:12px}.score{font-weight:1000;color:#d8ffed}
    .dots100{display:grid;grid-template-columns:repeat(20,1fr);gap:6px;position:relative}.trader-dot{aspect-ratio:1;border-radius:999px;background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.06)}.trader-dot.reward{background:rgba(53,227,162,.72);box-shadow:0 0 14px rgba(53,227,162,.28)}
    .metric-row{display:grid;grid-template-columns:repeat(5,1fr);gap:10px;position:relative}.metric{border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:20px;padding:15px;text-align:center}.metric .big{font-size:30px}
    .lock-list{display:grid;gap:11px;position:relative}.lock-item{display:flex;align-items:center;justify-content:space-between;gap:12px;border:1px solid rgba(255,255,255,.10);background:rgba(255,255,255,.04);border-radius:18px;padding:14px}.check{width:28px;height:28px;border-radius:12px;background:rgba(53,227,162,.14);display:grid;place-items:center;color:#d8ffed;font-weight:1000}
    .modal{display:none;position:fixed;inset:0;z-index:100;align-items:center;justify-content:center;background:rgba(0,0,0,.74);backdrop-filter:blur(12px);padding:18px}.modal.open{display:flex}.modal-card{width:min(760px,100%);max-height:92vh;overflow:auto;background:#0a111d;border:1px solid var(--line);border-radius:32px;box-shadow:var(--shadow)}.modal-head{display:flex;justify-content:space-between;gap:18px;padding:24px;border-bottom:1px solid var(--line)}.modal-body{padding:24px}.close{width:40px;height:40px;border-radius:99px;background:rgba(255,255,255,.08);color:rgba(255,255,255,.72);border:1px solid rgba(255,255,255,.10);cursor:pointer;font-size:22px}.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}label{display:grid;gap:7px;font-size:13px;font-weight:900;color:rgba(255,255,255,.70)}input,textarea{border:1px solid var(--line);background:rgba(255,255,255,.06);color:#fff;border-radius:18px;padding:12px 14px;outline:none;min-height:46px}textarea{min-height:118px}.full{grid-column:1/-1}.submit{grid-column:1/-1;border:0;border-radius:99px;background:linear-gradient(135deg,var(--emerald),#b7ffe1);color:#061018;font-weight:1000;min-height:50px;cursor:pointer}
    @media(max-width:960px){.step-dots{display:none}.pill{display:none}.nav{height:62px}.logo{width:38px;height:38px;border-radius:14px}.brand-title{font-size:11px}.wrap{padding:0 16px}.screen{min-height:auto;display:block;padding-top:26px;padding-bottom:88px}h1{font-size:42px;line-height:.98;margin-top:20px;letter-spacing:-.055em}.subline{font-size:16px;line-height:1.65;margin-top:18px}.note{font-size:13px}.actions{position:sticky;bottom:10px;z-index:30;background:rgba(4,7,13,.72);backdrop-filter:blur(18px);padding:10px;border:1px solid rgba(255,255,255,.10);border-radius:24px;margin-top:24px}.btn{flex:1;padding:0 15px}.visual{margin-top:22px}.card{border-radius:28px;padding:16px}.card-title{font-size:20px}.grid3,.grid2,.metric-row{grid-template-columns:1fr}.box{min-height:auto}.big{font-size:34px}.leader-row{grid-template-columns:auto 1fr auto}.leader-row .status{display:none}.dots100{grid-template-columns:repeat(10,1fr);gap:5px}.form{grid-template-columns:1fr}.float-symbols{opacity:.20}.sym{font-size:18px!important}.bg:before{animation:none;opacity:.54}}
  </style>
</head>
<body>
<div class="bg"></div>
<div class="float-symbols" aria-hidden="true">
  <span class="sym" style="left:8%;top:90%;font-size:34px;animation-duration:28s;">₿</span>
  <span class="sym gold" style="left:22%;top:120%;font-size:28px;animation-duration:36s;">AC</span>
  <span class="sym cyan" style="left:42%;top:105%;font-size:32px;animation-duration:31s;">FX</span>
  <span class="sym" style="left:68%;top:112%;font-size:26px;animation-duration:34s;">$</span>
  <span class="sym gold" style="left:82%;top:98%;font-size:30px;animation-duration:39s;">€</span>
</div>
<div class="page">
  <header><div class="wrap nav"><div class="brand"><div class="logo">A</div><div><span class="brand-title">ARENIX</span><span class="brand-sub">Training Arena</span></div></div><div id="dots" class="step-dots"></div><div class="top-actions"><span class="pill">Private Partner Access</span><button class="btn btn-primary" onclick="openApply()">Apply</button></div></div><div class="progress"><div id="progressBar"></div></div></header>
  <main><section id="screen" class="wrap screen"><div class="copy"><div class="eyebrow"><span id="num" class="num">01</span><span id="kicker">Tool</span></div><h1 id="headline"></h1><p id="subline" class="subline"></p><p id="note" class="note"></p><div class="actions"><button id="continueBtn" class="btn btn-primary" onclick="goNext()">Pokračovat →</button><button id="backBtn" class="btn btn-ghost" onclick="goBack()">Zpět</button></div></div><div id="visual" class="visual"></div></section></main>
</div>
<div id="applyModal" class="modal"><div class="modal-card"><div class="modal-head"><div><div class="eyebrow"><span class="num">A</span><span>Partner Access</span></div><h2 style="font-size:32px;letter-spacing:-.035em;margin:18px 0 0">Požádat o Partner Access</h2><p class="subline" style="font-size:14px;margin-top:8px">Privátní přístup pro schválené partnery. Toto je preview formulář.</p></div><button class="close" onclick="closeApply()">×</button></div><div class="modal-body"><form class="form" onsubmit="event.preventDefault(); alert('Preview only.');"><label>Jméno<input placeholder="Vaše jméno"></label><label>E-mail<input type="email" placeholder="email@example.com"></label><label>WhatsApp<input placeholder="+971..."></label><label>Velikost komunity<input placeholder="např. 500 členů"></label><label class="full">Hlavní kanály<input placeholder="Telegram, Discord, WhatsApp, YouTube..."></label><label class="full">Krátké představení<textarea placeholder="Co děláte a jakou komunitu chcete vytvořit, zvětšit nebo aktivovat?"></textarea></label><button class="submit" type="submit">Odeslat přihlášku</button></form></div></div></div>
<script>
const steps=[
{kicker:'Community Creator',headline:'Vytvořte si vlastní Forex a Crypto komunitu.',subline:'Nástroj pro vytvoření, růst a aktivaci vlastní komunity. Nečekáte, až lidé začnou reagovat sami — otevřte jim arénu, do které mají tradeři důvod vstoupit.',note:'Vaše komunita zůstává vaše. My dodáme arénu.',visual:'creator'},
{kicker:'Action Layer',headline:'Training Session dá publiku konkrétní akci',subline:'Lidé už jen nesledují další příspěvek, video nebo signál. Dostanou konkrétní vstup do privátní session, kde se mohou zapojit, ukázat aktivitu a stát se viditelnými.',note:'Pasivní publikum se mění na aktivní účastníky.',visual:'action'},
{kicker:'First Entry',headline:'Training Arena je první vstup do světa Trading Areny',subline:'Trader si přes Arena Credits vyzkouší princip arény, vstup do session, ranking, výsledek a pocit odměny už v Training Mode. Nečte teorii. Zažije model v simulované formě.',note:'Training Mode ukazuje logiku arény ještě před komerční verzí.',visual:'bridge'},
{kicker:'Partner Gate',headline:'Partner otevře vlastní arénu pro své tradery',subline:'Trader se do privátní arény nedostane sám. Přístup mu otevře partner přes vlastní Training Arenu. Tím partner buduje komunitu kolem svého jména, svého publika a svého vztahu s tradery.',note:'Partner je vstupní brána do své privátní arény.',visual:'partner'},
{kicker:'Invite Link',headline:'Jeden link spustí vstup do arény',subline:'Partner pošle jeden invite link do své skupiny, databáze, Discordu, Telegramu, WhatsAppu nebo YouTube publika. Kdo chce zažít arénu, vstupuje přes partnera.',note:'Není třeba měnit kanály. Aréna se přidá jako akční vrstva nad tím, co už partner má.',visual:'link'},
{kicker:'Arena Credits',headline:'Arena Credits ukážou celý cyklus arény během několika hodin',subline:'Trader vstoupí do session, Entry Credits se rezervují, leaderboard běží a po skončení session se zobrazí Final Arena Credits podle výsledku. Rychle, přehledně a bez čekání.',note:'Trader zažije pohyb arény v jednom krátkém cyklu.',visual:'credits'},
{kicker:'Leaderboard',headline:'Leaderboard ukáže výkon, pořadí a výsledek',subline:'Každá session má viditelný výsledek. Trader vidí svoji pozici, změnu Arena Credits a své místo v aréně. Partner vidí, kdo se opravdu zapojil a kdo jen sleduje z dálky.',note:'Trader získá status. Partner získá přehled.',visual:'leaderboard'},
{kicker:'Distribution Key',headline:'Aréna odměňuje 40 ze 100 traderů podle pevného klíče',subline:'Model Trading Areny není postavený jen na jednom vítězi. Distribuční klíč počítá s tím, že odměnu získává 40 ze 100 traderů podle pravidel arény — včetně traderů, kteří nemusí být absolutně na prvním místě.',note:'Training Arena ukáže tento princip přes simulované Arena Credits.',visual:'reward'},
{kicker:'Dashboard',headline:'Dashboard ukáže růst, aktivitu a sílu komunity',subline:'Partner vidí, kolik lidí pozval, kdo vstoupil do session, kdo zůstal aktivní, kdo se umístil v leaderboardu a jak se komunita vyvíjí. Čím lépe zná svou komunitu dnes, tím lépe s ní může pracovat v budoucím komerčním modelu.',note:'Dashboard není report. Je to ovládací panel komunity.',visual:'dashboard'},
{kicker:'Trust by Rules',headline:'Pevná pravidla arény vytvářejí důvěru',subline:'Partner přivádí komunitu, otevírá session a pracuje s publikem. Výsledek session se ale řídí pravidly arény, leaderboardem, Arena Credits a distribuční logikou nástroje. Pravidla nejsou o ručním rozhodování.',note:'Důvěra nevzniká ze slibů. Vzniká z pravidel, rychlosti a transparentního výsledku.',visual:'rules'}];
let active=0;
function card(title,badge,inner){return `<div class="visual-glow"></div><div class="card"><div class="card-head"><div><div class="tiny">${badge}</div><div class="card-title">${title}</div></div><span class="badge">${String(active+1).padStart(2,'0')} / 10</span></div>${inner}</div>`}
function renderVisual(type){
 if(type==='creator')return card('Tvůrce Komunity','Tool Output',`<div class="grid3"><div class="box"><div class="tiny">Publikum</div><div class="big">0 → 698</div><div class="small">růst komunity</div></div><div class="box active"><div class="tiny">Session</div><div class="big">Běží</div><div class="small">pod kontrolou partnera</div></div><div class="box"><div class="tiny">Training Arena</div><div class="big">Aktivita</div><div class="small">důvod vstoupit</div></div></div>`);
 if(type==='action')return card('Passive → Active','Audience Flow',`<div class="flow">${['Watching','Invited','Joined','Active'].map((x,i)=>`<div class="flow-row"><span class="rank">${String(i+1).padStart(2,'0')}</span><div><div class="flow-title">${x}</div><div class="flow-sub">${i===0?'content watcher':i===1?'private invite sent':i===2?'entered session':'visible participant'}</div></div><span class="status ${i>1?'green':''}">${i===3?'Visible':'Step'}</span></div>`).join('')}</div>`);
 if(type==='bridge')return card('Training → Trading Arena','First Entry',`<div class="grid2"><div class="box active"><div class="tiny">Training Arena</div><div class="big">AC</div><div class="small">Arena Credits · leaderboard · result</div></div><div class="box gold"><div class="tiny">Next Layer</div><div class="big">TA</div><div class="small">same logic · commercial review later</div></div></div><div class="flow-row" style="margin-top:12px"><span class="rank">→</span><div><div class="flow-title">Trader experiences the model first</div><div class="flow-sub">simple simulated form before commercial version</div></div><span class="status green">Bridge</span></div>`);
 if(type==='partner')return card('Partner Arena','Invite Only',`<div class="grid2"><div class="box active"><div class="tiny">Access</div><div class="big">Link</div><div class="small">opened by partner</div></div><div class="box"><div class="tiny">Community</div><div class="big">Own</div><div class="small">partner relationship stays</div></div></div><div class="flow-row" style="margin-top:12px"><span class="rank">🔒</span><div><div class="flow-title">No partner invite. No private entry.</div><div class="flow-sub">the partner becomes the gate to the arena</div></div><span class="status green">Private</span></div>`);
 if(type==='link')return card('One Invite Link','Existing Channels Stay',`<div class="flow">${['Telegram','WhatsApp','Discord','YouTube'].map(x=>`<div class="flow-row"><span class="check">✓</span><div><div class="flow-title">${x}</div><div class="flow-sub">keep channel · add arena layer</div></div><span class="status green">Ready</span></div>`).join('')}</div>`);
 if(type==='credits')return card('Arena Credit Lifecycle','Few Hours',`<div class="lifecycle"><div class="life-line"></div><div class="life"><span class="life-dot">1</span><div><div class="flow-title">Start Balance</div><div class="flow-sub">simulated training value</div></div><span class="value">500 AC</span></div><div class="life"><span class="life-dot">2</span><div><div class="flow-title">Entry Credits Reserved</div><div class="flow-sub">session entry logic</div></div><span class="value">100 AC</span></div><div class="life"><span class="life-dot">3</span><div><div class="flow-title">Session Live</div><div class="flow-sub">leaderboard running</div></div><span class="value">03:42:18</span></div><div class="life"><span class="life-dot">4</span><div><div class="flow-title">Final Arena Credits</div><div class="flow-sub">visible result after session</div></div><span class="value">653 AC</span></div></div>`);

}
function render(){const s=steps[active];document.getElementById('num').textContent=String(active+1).padStart(2,'0');document.getElementById('kicker').textContent=s.kicker;document.getElementById('headline').textContent=s.headline;document.getElementById('subline').textContent=s.subline;document.getElementById('note').textContent=s.note;document.getElementById('visual').innerHTML=renderVisual(s.visual);document.getElementById('backBtn').style.display=active===0?'none':'inline-flex';document.getElementById('continueBtn').innerHTML=active===steps.length-1?'Požádat o Partner Access →':'Pokračovat →';document.getElementById('progressBar').style.width=((active+1)/steps.length*100)+'%';document.getElementById('dots').innerHTML=steps.map((_,i)=>`<button class="dot ${i===active?'active':i<active?'done':''}" onclick="jump(${i})" aria-label="Step ${i+1}"></button>`).join('')}
function transition(update){const screen=document.getElementById('screen');screen.classList.add('switching');setTimeout(()=>{update();render();requestAnimationFrame(()=>screen.classList.remove('switching'))},140)}
function goNext(){if(active===steps.length-1){openApply();return}transition(()=>active++)}
function goBack(){if(active>0)transition(()=>active--)}
function jump(i){transition(()=>active=i)}
function openApply(){document.getElementById('applyModal').classList.add('open')}
function closeApply(){document.getElementById('applyModal').classList.remove('open')}
document.addEventListener('keydown',e=>{if(e.key==='ArrowRight')goNext();if(e.key==='ArrowLeft')goBack();if(e.key==='Escape')closeApply()});
document.getElementById('applyModal').addEventListener('click',e=>{if(e.target.id==='applyModal')closeApply()});
render();
</script>
</body>
</html>
